name: festival-achievement-hub

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-festival_hub}
      POSTGRES_USER: ${POSTGRES_USER:-festival_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    # Updates explicitly run `docker compose pull app`; avoiding `always`
    # prevents Compose from downloading the same image twice per deployment.
    pull_policy: missing
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-festival_hub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-festival_hub}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CLAIM_DEVICE_SECRET: ${CLAIM_DEVICE_SECRET:?Set CLAIM_DEVICE_SECRET in .env}
      GITHUB_UPDATE_TOKEN: ${GITHUB_UPDATE_TOKEN:-}
      GITHUB_UPDATE_REPOSITORY: ${GITHUB_UPDATE_REPOSITORY:-}
      GITHUB_UPDATE_WORKFLOW: ${GITHUB_UPDATE_WORKFLOW:-}
      GITHUB_UPDATE_REF: ${GITHUB_UPDATE_REF:-main}
      APP_VERSION: ${APP_VERSION:-development}
      ADMIN_OPERATION_LOG_PATH: /app/data/admin-operations.jsonl
      # Enable only when a trusted reverse proxy is the sole entry point.
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    ports:
      # Keep 127.0.0.1 behind a reverse proxy. Use 0.0.0.0 only for an
      # intentionally LAN-accessible HTTP deployment protected by a firewall.
      - "${SERVER_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    volumes:
      - operation_logs:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      # A normal bridge is required for published host ports. PostgreSQL stays
      # reachable only through the separate internal backend network.
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    internal: true

volumes:
  postgres_data:
    name: festival_hub_postgres_data
  operation_logs:
    name: festival_hub_operation_logs
